{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- Main Content -->
<div class="auth-page-wrapper">
  <div class="auth-background">
    <img src="{% static 'img/background/pattern.jpg'%}" alt="Background pattern">
  </div>
  <div class="auth-form-container">
    <div class="auth-container auth-container--change-password">
      <form class="auth-form" id="password-change-form"
          method = "post"
          action = "{%url 'users:password_change'%}">

          {% csrf_token %}

          {{ form.as_p }}

        <div class="ButtonGroup ButtonGroup--center">
          <a href="{% url 'users:account' %}" class="button button--cancel">Cancel</a>
          <button type="submit" class="button button--primary">Change Password</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
