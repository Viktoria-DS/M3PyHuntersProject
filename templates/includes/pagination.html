<div class="pagination">
    <a {% if page_obj.has_previous %}href="{% querystring page=page_obj.previous_page_number %}"{% endif %}
       {% if not page_obj.has_previous %}aria-disabled="true"{% endif %}
       class="pagination__link pagination__link--prev">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Previous</span>
    </a>
    <div class="pagination-list">
        {% for page in page_obj.paginator.page_range %}
            <a href="{% querystring page=page %}"
               {% if page == page_obj.number %}aria-current="page"{% endif %}
               class="pagination__link {% if page == page_obj.number %}active{% endif %}">{{ page }}</a>
        {% endfor %}
    </div>
    <a {% if page_obj.has_next %}href="{% querystring page=page_obj.next_page_number %}"{% endif %}
       {% if not page_obj.has_next %}aria-disabled="true"{% endif %}
       class="pagination__link pagination__link--next">
        <i class="fa-solid fa-arrow-right"></i>
        <span>Next</span>
    </a>
</div>
